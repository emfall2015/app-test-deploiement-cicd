services:
  backend:
    image: emfall/deploiement-backend:latest
    container_name: deploiement-backend
    ports:
      - "3000:3000"
    networks:
      - appnet

  frontend:
    image: emfall/deploiement-frontend:latest
    container_name: deploiement-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet: