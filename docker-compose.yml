services:
  backend:
    build:
      context: ./backend
    container_name: deploiement-backend
    ports:
      - "3000:3000"
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    container_name: deploiement-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - appnet
networks:
  appnet: