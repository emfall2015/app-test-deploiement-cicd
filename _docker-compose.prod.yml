#utilisé par la VM Azure : on TÉLÉCHARGE les images depuis Docker Hub
services:
  backend:
    image: svetlanna9/deploiement-cicd:backend
    container_name: deploiement-backend
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    image: svetlanna9/deploiement-cicd:frontend
    container_name: deploiement-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge