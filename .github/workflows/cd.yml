name: CD - Pipeline

# Démarre quand la CI est terminée, seulement pour main
on:
  workflow_run:
    workflows: ["CI - Lancer le projet"]
    types: [completed]
    branches: [main]

jobs:

  # ─── Job 1 : construire les images et les envoyer sur Docker Hub ───
  push-images:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupérer le code testé par la CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Image backend → Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/deploiement-cicd:backend

      - name: 5. Image frontend → Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/deploiement-cicd:frontend

  # ─── Job 2 : la VM télécharge les images et redémarre ───
  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur la VM Azure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}

          script: |
            set -e
            cd /home/groupe1/app-test-deploiement-cicd
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            sleep 10
            curl --fail http://localhost:3000/api/health
            curl --fail http://localhost:4200/