name: CI - Lancer le projet
run-name: ${{ github.actor }} Lancer le projet

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main,dev]
  workflow_dispatch:

jobs:
  
  lancer-avec-docker:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Créer le fichier .env
        run: |
          echo "PORT=3000" > backend/.env
          cat backend/.env

      - name: 3. Compilation de l'image frontend
        run: docker build -t svetlanna9/deploiement-cicd:frontend ./frontend
      
      - name: 3'. Compilation de l'image backend
        run: docker build -t svetlanna9/deploiement-cicd:backend ./backend

      - name: 3". Connexion à DockerHub
        uses: docker/login-action@v4
        with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3*. Envoi des images vers DOckerHub
        run: |
          docker push svetlanna9/deploiement-cicd:frontend
          docker push svetlanna9/deploiement-cicd:backend

      - name: 4. Lancer les tests du backend dans l'image du conteneur
        run: docker run --rm svetlanna9/app-test-deploiement-cicd:backend npm test

      - name: 5. Tester le backend
        run: |
          curl --fail http://backend:3000/api/health
          curl --fail http://backend:3000/api/info

      - name: 6. Tester le frontend
        run: curl --fail http://frontend:4200/

      - name: 7. Afficher les logs du conteneur
        if: always()
        run: docker compose logs

      - name: 8. Arrêter le conteneur
        if: always()
        run: docker compose down